version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: recruitiq-postgres
    environment:
      POSTGRES_USER: recruitiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recruitiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitiq-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: recruitiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitiq-network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: recruitiq-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://recruitiq:password@postgres:5432/recruitiq
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recruitiq-network

volumes:
  postgres_data:

networks:
  recruitiq-network:
    driver: bridge
