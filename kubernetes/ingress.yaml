apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recruitiq-ingress
  namespace: recruitiq
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - recruitiq.example.com
    secretName: recruitiq-tls
  rules:
  - host: recruitiq.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: recruitiq-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: recruitiq-backend
            port:
              number: 8000
