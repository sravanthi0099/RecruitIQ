apiVersion: v1
kind: Namespace
metadata:
  name: recruitiq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruitiq-backend
  namespace: recruitiq
spec:
  replicas: 3
  selector:
    matchLabels:
      app: recruitiq-backend
  template:
    metadata:
      labels:
        app: recruitiq-backend
    spec:
      containers:
      - name: backend
        image: recruitiq-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: recruitiq-secrets
              key: database-url
        - name: REDIS_URL
          value: redis://recruitiq-redis:6379
        - name: ENVIRONMENT
          value: production
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruitiq-frontend
  namespace: recruitiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recruitiq-frontend
  template:
    metadata:
      labels:
        app: recruitiq-frontend
    spec:
      containers:
      - name: frontend
        image: recruitiq-frontend:latest
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recruitiq-postgres
  namespace: recruitiq
spec:
  serviceName: recruitiq-postgres
  replicas: 1
  selector:
    matchLabels:
      app: recruitiq-postgres
  template:
    metadata:
      labels:
        app: recruitiq-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: recruitiq
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: recruitiq-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: recruitiq
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U recruitiq
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruitiq-redis
  namespace: recruitiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recruitiq-redis
  template:
    metadata:
      labels:
        app: recruitiq-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
