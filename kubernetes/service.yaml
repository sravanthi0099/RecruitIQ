apiVersion: v1
kind: Service
metadata:
  name: recruitiq-backend
  namespace: recruitiq
spec:
  type: ClusterIP
  selector:
    app: recruitiq-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: recruitiq-frontend
  namespace: recruitiq
spec:
  type: LoadBalancer
  selector:
    app: recruitiq-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: recruitiq-postgres
  namespace: recruitiq
spec:
  clusterIP: None
  selector:
    app: recruitiq-postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: recruitiq-redis
  namespace: recruitiq
spec:
  type: ClusterIP
  selector:
    app: recruitiq-redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
